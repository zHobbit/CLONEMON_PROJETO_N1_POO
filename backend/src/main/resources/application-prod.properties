# Perfil de producao (SPRING_PROFILES_ACTIVE=prod). Sem valores padrao:
# se faltar alguma variavel, a aplicacao nem sobe.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
clonemon.jwt.secret=${JWT_SECRET}

# Pool pequeno e sem conexoes ociosas, para o Postgres serverless (Neon) poder desligar quando nao ha uso.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
