spring.application.name=clonemon

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clonemon}
spring.datasource.username=${DB_USER:clonemon}
spring.datasource.password=${DB_PASSWORD:clonemon}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Em producao, defina JWT_SECRET (minimo 32 bytes).
clonemon.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
clonemon.jwt.ttl=7d
