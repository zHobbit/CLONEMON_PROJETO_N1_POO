services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clonemon
      POSTGRES_USER: clonemon
      POSTGRES_PASSWORD: clonemon
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clonemon"]
      interval: 5s
      retries: 10

  # A imagem de producao (jogo + API). So sobe com: docker compose --profile app up --build
  app:
    profiles: ["app"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/clonemon
      DB_USER: clonemon
      DB_PASSWORD: clonemon
      JWT_SECRET: local-docker-secret-not-for-production-0123456789
    ports:
      - "8081:8081"

volumes:
  pgdata:
